<!doctype html>
<!--
  Source for the extension icons (static/icons/icon-*.png).
  Uses the REAL Influencer Butler logo (public/assets/influencer-butler-logo.png):
  crops the butler mark (drops the wordmark), makes the white background
  transparent via an edge flood fill (the white shirt stays, because it is
  not connected to the border), and draws it centered at the requested size.
  Render with: npm run icons (extension/scripts/gen-icons.mjs, which passes
  --allow-file-access-from-files so canvas pixel access works from file://).
-->
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="out"></canvas>
<script>
  const size = parseInt(new URLSearchParams(location.search).get("size") || "128", 10);
  const img = new Image();
  img.src = "../../../public/assets/influencer-butler-logo.png";
  img.onload = () => {
    // Read the full logo.
    const src = document.createElement("canvas");
    src.width = img.naturalWidth;
    src.height = img.naturalHeight;
    const sctx = src.getContext("2d", { willReadFrequently: true });
    sctx.drawImage(img, 0, 0);
    const data = sctx.getImageData(0, 0, src.width, src.height);
    const { width: W, height: H } = data;
    const px = data.data;
    const nearWhite = (i) => px[i] > 235 && px[i + 1] > 235 && px[i + 2] > 235;

    // Find the butler mark's bounding box, ignoring the wordmark: only look
    // at the top 68% of the image (the text starts below the tux).
    const yLimit = Math.floor(H * 0.68);
    let minX = W, minY = H, maxX = 0, maxY = 0;
    for (let y = 0; y < yLimit; y++) {
      for (let x = 0; x < W; x++) {
        const i = (y * W + x) * 4;
        if (px[i + 3] > 10 && !nearWhite(i)) {
          if (x < minX) minX = x;
          if (x > maxX) maxX = x;
          if (y < minY) minY = y;
          if (y > maxY) maxY = y;
        }
      }
    }

    // Flood fill from every border pixel of the crop region: connected
    // near-white pixels become transparent. Interior whites (the shirt)
    // are unreachable from the border, so they survive.
    const cw = maxX - minX + 1;
    const ch = maxY - minY + 1;
    const visited = new Uint8Array(cw * ch);
    const queue = [];
    const push = (x, y) => {
      if (x < 0 || y < 0 || x >= cw || y >= ch || visited[y * cw + x]) return;
      const i = ((y + minY) * W + (x + minX)) * 4;
      if (px[i + 3] <= 10 || nearWhite(i)) {
        visited[y * cw + x] = 1;
        px[i + 3] = 0;
        queue.push(x, y);
      }
    };
    for (let x = 0; x < cw; x++) { push(x, 0); push(x, ch - 1); }
    for (let y = 0; y < ch; y++) { push(0, y); push(cw - 1, y); }
    while (queue.length > 0) {
      const y = queue.pop();
      const x = queue.pop();
      push(x + 1, y); push(x - 1, y); push(x, y + 1); push(x, y - 1);
    }
    sctx.putImageData(data, 0, 0);

    // Draw the mark centered in a square canvas at the target size, with a
    // small margin, stepping down in halves for a clean downscale.
    const out = document.getElementById("out");
    out.width = size;
    out.height = size;
    const margin = size >= 48 ? Math.round(size * 0.04) : 0;
    const box = size - margin * 2;
    const scale = Math.min(box / cw, box / ch);
    const dw = cw * scale;
    const dh = ch * scale;

    let stage = src, sx = minX, sy = minY, sw = cw, sh = ch;
    while (sw / 2 > dw) {
      const half = document.createElement("canvas");
      half.width = Math.ceil(sw / 2);
      half.height = Math.ceil(sh / 2);
      const hctx = half.getContext("2d");
      hctx.imageSmoothingQuality = "high";
      hctx.drawImage(stage, sx, sy, sw, sh, 0, 0, half.width, half.height);
      stage = half; sx = 0; sy = 0; sw = half.width; sh = half.height;
    }

    const ctx = out.getContext("2d");
    ctx.imageSmoothingQuality = "high";
    ctx.drawImage(stage, sx, sy, sw, sh, (size - dw) / 2, (size - dh) / 2, dw, dh);
    document.title = "done";
  };
</script>
</body>
</html>
