<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      /* Branded blog cover for "Your Next Amazon Video Is Already in Your House".
         Warm orange (#f59e0b) accent on cream with navy text, matching the blog
         illustration palette. Rendered to PNG by
         scripts/generate-orders-butler-cover.mjs (headless Chrome screenshot). */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1600px;
        height: 900px;
        font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: #fdf6ec;
      }
      .frame {
        width: 100%;
        height: 100%;
        display: flex;
        padding: 72px;
      }
      .card {
        width: 100%;
        height: 100%;
        border-radius: 36px;
        background:
          radial-gradient(1200px 600px at 85% -10%, #fff7ec 0%, #ffffff 55%);
        border: 1px solid #f4e6cf;
        box-shadow: 0 30px 80px rgba(15, 23, 42, 0.08);
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 96px 104px;
      }
      .brand {
        position: absolute;
        top: 56px;
        left: 96px;
        font-size: 32px;
        font-weight: 700;
        color: #0f172a;
        letter-spacing: 0.02em;
      }
      .brand span { color: #f59e0b; }
      .kicker {
        display: inline-block;
        align-self: flex-start;
        font-size: 24px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        color: #b45309;
        background: #fff2db;
        border: 2px solid #f59e0b;
        border-radius: 999px;
        padding: 12px 28px;
        margin-bottom: 40px;
      }
      .title {
        font-size: 88px;
        font-weight: 800;
        color: #0f172a;
        line-height: 1.05;
        max-width: 1180px;
        letter-spacing: -0.01em;
      }
      .title b { color: #f59e0b; }
      .sub {
        margin-top: 40px;
        font-size: 40px;
        font-weight: 500;
        color: #475569;
        line-height: 1.3;
        max-width: 1120px;
      }
      .chips {
        margin-top: 56px;
        display: flex;
        gap: 20px;
      }
      .chip {
        font-size: 30px;
        font-weight: 700;
        color: #0f172a;
        background: #ffffff;
        border: 2px solid #e2cfa8;
        border-radius: 18px;
        padding: 18px 30px;
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .chip .dot { font-size: 34px; }
      .glow {
        position: absolute;
        right: -120px;
        bottom: -160px;
        width: 520px;
        height: 520px;
        border-radius: 50%;
        background: radial-gradient(circle at 40% 40%, #fbbf24 0%, rgba(251,191,36,0) 68%);
        opacity: 0.5;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="card">
        <div class="brand">Influencer <span>Butler</span></div>
        <div class="glow"></div>
        <div class="kicker">Amazon Influencer Program for Beginners</div>
        <div class="title">Your next Amazon video is <b>already in your house</b></div>
        <div class="sub">Find high-demand, low-competition shoppable video ideas with Orders Butler.</div>
        <div class="chips">
          <div class="chip"><span class="dot">📈</span> High demand</div>
          <div class="chip"><span class="dot">🎥</span> Low competition</div>
          <div class="chip"><span class="dot">🏠</span> Products you own</div>
        </div>
      </div>
    </div>
  </body>
</html>
