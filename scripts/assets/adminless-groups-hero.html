<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      * { margin: 0; padding: 0; }
      html, body { width: 1600px; height: 1000px; }
      svg { display: block; }
    </style>
  </head>
  <body>
    <!--
      Hero illustration for the "How to become admin of Facebook groups that
      lost their admins" blog post. Editorial flat-vector style in the site
      palette (warm orange #f59e0b, navy #0f172a, cream), matching
      fb-notifications-hero.html. Metaphor: a busy group page with a row of
      members, a "No admin" marker, and Facebook's "Join the new admin team"
      banner with its "Become admin" button being clicked. Rendered to
      public/assets/blog/become-admin-of-facebook-groups-that-lost-their-admins.png
      by scripts/generate-adminless-groups-hero.mjs (headless Chrome screenshot).
    -->
    <svg width="1600" height="1000" viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="bg" gradientUnits="userSpaceOnUse" cx="820" cy="380" r="1050">
          <stop offset="0" stop-color="#fffdf8" />
          <stop offset="0.62" stop-color="#fdf3de" />
          <stop offset="1" stop-color="#f7e2ba" />
        </radialGradient>
        <linearGradient id="org" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#f9ad2e" />
          <stop offset="1" stop-color="#ef8f0d" />
        </linearGradient>
        <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#1e293b" />
          <stop offset="1" stop-color="#0f172a" />
        </linearGradient>
        <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#1d4ed8" />
          <stop offset="1" stop-color="#0f172a" />
        </linearGradient>
        <path id="spark" d="M0,-12 Q0,0 12,0 Q0,0 0,12 Q0,0 -12,0 Q0,0 0,-12 Z" />
        <g id="member">
          <circle cx="0" cy="0" r="26" fill="#e2e8f0" />
          <circle cx="0" cy="-7" r="10" fill="#94a3b8" />
          <path d="M-17 20 Q-17 4 0 4 Q17 4 17 20 Z" fill="#94a3b8" />
        </g>
      </defs>

      <!-- background -->
      <rect x="0" y="0" width="1600" height="1000" fill="url(#bg)" />
      <circle cx="230" cy="180" r="150" fill="#fdeecb" opacity="0.6" />
      <circle cx="1420" cy="800" r="200" fill="#fdeecb" opacity="0.55" />

      <!-- ===== browser window ===== -->
      <g>
        <ellipse cx="800" cy="716" rx="440" ry="26" fill="#e4d0a4" opacity="0.5" />
        <rect x="320" y="176" width="960" height="514" rx="24" fill="url(#screen)" />
        <circle cx="358" cy="214" r="7" fill="#ef4444" />
        <circle cx="382" cy="214" r="7" fill="#f59e0b" />
        <circle cx="406" cy="214" r="7" fill="#22c55e" />
        <rect x="442" y="198" width="720" height="32" rx="16" fill="#334155" />
        <circle cx="464" cy="214" r="7" fill="none" stroke="#94a3b8" stroke-width="2.5" />
        <rect x="482" y="209" width="170" height="10" rx="5" fill="#64748b" />
        <!-- page area -->
        <rect x="342" y="252" width="916" height="416" rx="12" fill="#f8fafc" />
      </g>

      <!-- ===== group page ===== -->
      <g>
        <!-- cover photo -->
        <rect x="342" y="252" width="916" height="118" rx="12" fill="url(#cover)" />
        <rect x="342" y="330" width="916" height="40" fill="url(#cover)" />
        <!-- group name + meta lines -->
        <rect x="372" y="392" width="300" height="16" rx="8" fill="#0f172a" />
        <rect x="372" y="420" width="180" height="11" rx="5.5" fill="#94a3b8" />

        <!-- member avatars row -->
        <use href="#member" transform="translate(408 490)" />
        <use href="#member" transform="translate(452 490)" />
        <use href="#member" transform="translate(496 490)" />
        <use href="#member" transform="translate(540 490)" />
        <use href="#member" transform="translate(584 490)" />
        <use href="#member" transform="translate(628 490)" />
        <circle cx="672" cy="490" r="26" fill="#0f172a" />
        <text x="672" y="497" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#ffffff">+2k</text>

        <!-- post skeletons -->
        <rect x="372" y="540" width="330" height="11" rx="5.5" fill="#cbd5e1" />
        <rect x="372" y="562" width="280" height="11" rx="5.5" fill="#cbd5e1" />
        <rect x="372" y="584" width="300" height="11" rx="5.5" fill="#cbd5e1" />
        <rect x="372" y="618" width="120" height="11" rx="5.5" fill="#cbd5e1" />

        <!-- "No admin" pill under the banner (right column) -->
        <rect x="900" y="566" width="150" height="36" rx="18" fill="#e2e8f0" />
        <circle cx="924" cy="584" r="7" fill="#94a3b8" />
        <text x="990" y="591" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#64748b">No admin</text>
      </g>

      <!-- ===== the "Join the new admin team" banner ===== -->
      <g>
        <rect x="748" y="392" width="470" height="150" rx="18" fill="#0b1220" opacity="0.35" />
        <rect x="740" y="384" width="470" height="150" rx="18" fill="#ffffff" stroke="#f59e0b" stroke-width="3" />
        <!-- shield icon -->
        <path d="M782 412 L806 402 L830 412 L830 436 Q830 456 806 466 Q782 456 782 436 Z" fill="#0f172a" opacity="0.85" />
        <path d="M796 434 L803 441 L818 424" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
        <text x="850" y="424" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#0f172a">Join the new admin team</text>
        <rect x="850" y="440" width="300" height="11" rx="5.5" fill="#cbd5e1" />
        <!-- Become admin button -->
        <rect x="850" y="468" width="222" height="48" rx="24" fill="url(#org)" />
        <text x="961" y="500" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="23" font-weight="800" fill="#ffffff" letter-spacing="0.4">Become admin</text>
        <circle cx="961" cy="492" r="58" fill="none" stroke="#f59e0b" stroke-width="3" opacity="0.4" />
        <circle cx="961" cy="492" r="78" fill="none" stroke="#f59e0b" stroke-width="2.5" opacity="0.2" />
      </g>

      <!-- cursor arrow pointing at Become admin -->
      <g transform="translate(1000 506)">
        <path d="M0 0 L0 40 L10 30 L17 46 L27 41 L19 26 L32 25 Z" fill="#0f172a" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" />
      </g>

      <!-- ===== badges ===== -->
      <g transform="rotate(-8 290 280)">
        <rect x="192" y="252" width="196" height="58" rx="29" fill="url(#org)" />
        <text x="290" y="291" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#ffffff" letter-spacing="1">1 CLICK</text>
      </g>
      <g>
        <circle cx="1340" cy="232" r="58" fill="url(#org)" />
        <circle cx="1340" cy="232" r="58" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.45" />
        <text x="1340" y="243" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="23" font-weight="800" fill="#ffffff">ADMIN</text>
      </g>

      <!-- butler bowler hat mark -->
      <g transform="translate(1340 640)">
        <ellipse cx="0" cy="0" rx="58" ry="14" fill="#f59e0b" />
        <path d="M-30 0 Q-30 -54 0 -54 Q30 -54 30 0 Z" fill="#f59e0b" />
        <rect x="-30" y="-15" width="60" height="11" fill="#0f172a" opacity="0.85" />
      </g>

      <!-- sparkles -->
      <use href="#spark" transform="translate(1236 740) scale(1.2)" fill="#f59e0b" />
      <use href="#spark" transform="translate(258 660) scale(1.1)" fill="#0f172a" opacity="0.5" />
      <use href="#spark" transform="translate(1418 470) scale(0.9)" fill="#f59e0b" />
      <use href="#spark" transform="translate(196 470) scale(0.8)" fill="#0f172a" opacity="0.45" />
    </svg>
  </body>
</html>
