<!DOCTYPE html>
<!-- Chrome Web Store small promo tile: 440x280. Rendered headless at exactly
     440x280 (see docs/chrome-web-store-listing.md). -->
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 440px; height: 280px; overflow: hidden; }
  body {
    font-family: "Segoe UI", -apple-system, system-ui, Arial, sans-serif;
    background: linear-gradient(135deg, #c2410c 0%, #ea580c 40%, #f97316 70%, #f59e0b 100%);
    position: relative;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
  }
  .blob { position: absolute; border-radius: 50%; filter: blur(50px); opacity: .5; }
  .blob1 { width: 220px; height: 220px; background: #fde68a; top: -90px; right: -70px; }
  .blob2 { width: 200px; height: 200px; background: #7c2d12; bottom: -100px; left: -80px; opacity: .35; }
  .logo { width: 64px; height: 64px; border-radius: 14px; box-shadow: 0 8px 20px rgba(124,45,18,.4); position: relative; }
  h1 {
    margin-top: 14px; color: #fff; font-size: 30px; font-weight: 800; letter-spacing: -.01em;
    text-shadow: 0 2px 10px rgba(124,45,18,.35); position: relative;
  }
  .tag {
    margin-top: 6px; color: rgba(255,255,255,.95); font-size: 15.5px; font-weight: 600;
    text-shadow: 0 1px 6px rgba(124,45,18,.35); position: relative; padding: 0 30px; line-height: 1.3;
  }
  .pill {
    margin-top: 14px; position: relative;
    background: #fff; color: #c2410c; font-weight: 800; font-size: 13px;
    letter-spacing: .18em; padding: 6px 18px; border-radius: 999px;
    box-shadow: 0 6px 16px rgba(124,45,18,.35);
  }
</style>
</head>
<body>
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
  <img class="logo" src="../../public/assets/influencer-butler-logo.png" alt="">
  <h1>Influencer Butler</h1>
  <div class="tag">Amazon influencer research tools, right on the page</div>
  <div class="pill">FREE</div>
</body>
</html>
