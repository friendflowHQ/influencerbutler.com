<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; padding: 0; }
  #stage { width: 1536px; height: 1024px; }
  svg { display: block; }
</style>
</head>
<body>
<div id="stage">
<svg width="1536" height="1024" viewBox="0 0 1536 1024" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FEF6EA"/>
      <stop offset="1" stop-color="#FBE9CF"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#1E2A4A" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1536" height="1024" fill="url(#bg)"/>
  <circle cx="200" cy="180" r="120" fill="#F59E0B" opacity="0.06"/>
  <circle cx="1360" cy="880" r="160" fill="#1E2A4A" opacity="0.05"/>

  <!-- wordmark -->
  <g transform="translate(108,92)">
    <circle cx="22" cy="20" r="22" fill="#1E2A4A"/>
    <path d="M11 26 q11 -13 22 0" fill="none" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
    <circle cx="22" cy="14" r="6" fill="#F59E0B"/>
    <text x="58" y="28" font-size="30" font-weight="700" fill="#1E2A4A">Influencer <tspan fill="#F59E0B">Butler</tspan></text>
  </g>

  <!-- LEFT: ChatGPT the chat app -->
  <g transform="translate(120,300)" filter="url(#soft)">
    <rect width="560" height="470" rx="34" fill="#FFFFFF"/>
    <!-- window header -->
    <rect x="0" y="0" width="560" height="70" rx="34" fill="#F1F5F9"/>
    <rect x="0" y="36" width="560" height="34" fill="#F1F5F9"/>
    <circle cx="40" cy="35" r="9" fill="#E2707A"/>
    <circle cx="70" cy="35" r="9" fill="#F0C24B"/>
    <circle cx="100" cy="35" r="9" fill="#7FBF7F"/>
    <text x="520" y="42" text-anchor="end" font-size="22" font-weight="600" fill="#94A3B8">chat.openai.com</text>
    <!-- incoming bubble -->
    <rect x="42" y="118" width="330" height="78" rx="24" fill="#EEF2F7"/>
    <rect x="70" y="146" width="230" height="12" rx="6" fill="#C7D2DE"/>
    <rect x="70" y="168" width="150" height="12" rx="6" fill="#C7D2DE"/>
    <!-- outgoing bubble -->
    <rect x="190" y="228" width="330" height="78" rx="24" fill="#F59E0B"/>
    <rect x="218" y="256" width="240" height="12" rx="6" fill="#FFFFFF" opacity="0.85"/>
    <rect x="218" y="278" width="160" height="12" rx="6" fill="#FFFFFF" opacity="0.7"/>
    <!-- input row -->
    <rect x="42" y="352" width="476" height="66" rx="33" fill="#F1F5F9"/>
    <text x="72" y="393" font-size="24" fill="#94A3B8">Type a message...</text>
    <circle cx="480" cy="385" r="24" fill="#1E2A4A"/>
    <path d="M470 385 h20 M482 377 l8 8 l-8 8" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="400" y="828" text-anchor="middle" font-size="34" font-weight="800" fill="#1E2A4A">ChatGPT</text>
  <text x="400" y="866" text-anchor="middle" font-size="24" fill="#64748B">the chat app you type into</text>

  <!-- CENTER vs -->
  <g transform="translate(768,540)">
    <circle r="52" fill="#1E2A4A"/>
    <text y="14" text-anchor="middle" font-size="38" font-weight="800" fill="#FFFFFF">vs</text>
  </g>

  <!-- RIGHT: OpenAI API key powering butlers -->
  <g transform="translate(856,300)" filter="url(#soft)">
    <rect width="560" height="470" rx="34" fill="#FFFFFF"/>

    <!-- API key -->
    <g transform="translate(60,150)">
      <circle cx="46" cy="46" r="46" fill="#F59E0B"/>
      <circle cx="46" cy="46" r="20" fill="#FFFFFF"/>
      <rect x="86" y="34" width="150" height="24" rx="12" fill="#F59E0B"/>
      <rect x="196" y="34" width="16" height="42" rx="6" fill="#F59E0B"/>
      <rect x="160" y="34" width="16" height="36" rx="6" fill="#F59E0B"/>
      <text x="18" y="120" font-size="24" font-weight="700" fill="#1E2A4A" font-family="Consolas, monospace">sk-••••••••</text>
    </g>

    <!-- dashed connector -->
    <path d="M330 196 C 400 196, 400 300, 470 300" fill="none" stroke="#F59E0B" stroke-width="5" stroke-dasharray="4 12" stroke-linecap="round"/>

    <!-- three little butler bots -->
    <g transform="translate(360,300)">
      <g>
        <rect x="0" y="0" width="56" height="56" rx="16" fill="#1E2A4A"/>
        <circle cx="19" cy="24" r="6" fill="#FCD9A0"/>
        <circle cx="37" cy="24" r="6" fill="#FCD9A0"/>
        <path d="M22 40 h12" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
      </g>
      <g transform="translate(74,-14)">
        <rect x="0" y="0" width="56" height="56" rx="16" fill="#1E2A4A"/>
        <circle cx="19" cy="24" r="6" fill="#FCD9A0"/>
        <circle cx="37" cy="24" r="6" fill="#FCD9A0"/>
        <path d="M22 40 h12" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
      </g>
      <g transform="translate(148,0)">
        <rect x="0" y="0" width="56" height="56" rx="16" fill="#1E2A4A"/>
        <circle cx="19" cy="24" r="6" fill="#FCD9A0"/>
        <circle cx="37" cy="24" r="6" fill="#FCD9A0"/>
        <path d="M22 40 h12" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
      </g>
    </g>
  </g>
  <text x="1136" y="828" text-anchor="middle" font-size="34" font-weight="800" fill="#1E2A4A">OpenAI API</text>
  <text x="1136" y="866" text-anchor="middle" font-size="24" fill="#64748B">the key your butlers actually use</text>

</svg>
</div>
</body>
</html>
