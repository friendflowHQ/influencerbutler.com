<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      /* Branded, obviously-a-placeholder card. Warm orange (#f59e0b) accent on
         cream with navy text, matching the blog illustration palette. Rendered
         to PNG by scripts/generate-cloud-pc-placeholders.mjs (headless Chrome
         screenshot). Each step's real screenshot replaces the PNG in place. */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1600px;
        height: 1000px;
        font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: #fdf6ec;
      }
      .frame {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 64px;
      }
      .card {
        width: 100%;
        height: 100%;
        border: 6px dashed #f59e0b;
        border-radius: 32px;
        background: #ffffff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 72px;
        position: relative;
      }
      .brand {
        position: absolute;
        top: 40px;
        left: 48px;
        font-size: 30px;
        font-weight: 700;
        color: #0f172a;
        letter-spacing: 0.02em;
      }
      .brand span { color: #f59e0b; }
      .badge {
        position: absolute;
        top: 44px;
        right: 48px;
        font-size: 22px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: #f59e0b;
        background: #fff7ec;
        border: 2px solid #f59e0b;
        border-radius: 999px;
        padding: 10px 24px;
      }
      .icon { font-size: 150px; line-height: 1; margin-bottom: 28px; }
      .title {
        font-size: 76px;
        font-weight: 800;
        color: #0f172a;
        line-height: 1.08;
        max-width: 1200px;
      }
      .caption {
        margin-top: 32px;
        font-size: 40px;
        font-weight: 500;
        color: #475569;
        line-height: 1.35;
        max-width: 1100px;
      }
      .hint {
        margin-top: 40px;
        font-size: 28px;
        color: #94a3b8;
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="card">
        <div class="brand">Influencer <span>Butler</span></div>
        <div class="badge" id="badge">Placeholder</div>
        <div class="icon">📷</div>
        <div class="title" id="title">Screenshot goes here</div>
        <div class="caption" id="caption"></div>
        <div class="hint">Replace this image with your own screenshot</div>
      </div>
    </div>
    <script>
      const q = new URLSearchParams(location.search);
      const title = q.get("title");
      const caption = q.get("caption");
      const badge = q.get("badge");
      if (title) document.getElementById("title").textContent = decodeURIComponent(title);
      if (caption) document.getElementById("caption").textContent = decodeURIComponent(caption);
      if (badge) document.getElementById("badge").textContent = decodeURIComponent(badge);
    </script>
  </body>
</html>
